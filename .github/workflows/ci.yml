name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-validate:
    name: HTML validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npx --yes html-validate@9.7.1 "**/*.html"
      - name: Staging password gate tests
        run: npm test
      - name: Reject absolute queerglobal.com internal links
        run: bash scripts/reject-absolute-internal-links.sh

  deploy-scripts:
    name: deploy scripts (shellcheck + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck scripts/*.sh
      - run: python -m unittest discover -s scripts/tests -v

  deploy:
    name: deploy to Cloudflare Pages
    needs: [html-validate, deploy-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      STAGING_HOST: queerglobal.staging.grandkru.com
      PAGES_PROJECT: queerglobal-grandkru
      QUEERGLOBAL_BASIC_AUTH_USER: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_USER }}
      QUEERGLOBAL_BASIC_AUTH_PASS: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_PASS }}
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID secrets are not set on this repo"
            exit 1
          fi
          if [ -z "$QUEERGLOBAL_BASIC_AUTH_USER" ] || [ -z "$QUEERGLOBAL_BASIC_AUTH_PASS" ]; then
            echo "::error::QUEERGLOBAL_BASIC_AUTH_USER / QUEERGLOBAL_BASIC_AUTH_PASS secrets are not set on this repo"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Stage site (static assets + Pages Functions middleware)
        run: rsync -a --exclude='.*' --exclude=scripts --exclude=tests --exclude=package.json ./ "$RUNNER_TEMP/site/"
      - name: Require Pages project (do not create)
        run: bash scripts/ensure-pages-project.sh "$PAGES_PROJECT"
      - id: wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name queerglobal-grandkru --branch main
      - name: Smoke test deployment URL
        env:
          DEPLOY_URL: ${{ steps.wrangler.outputs.deployment-url }}
          BASIC_AUTH_USER: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_PASS }}
          SMOKE_PATHS: / /aboutus/ /blog/ /contactus/ /donations/ /resources/
        run: |
          echo "deployment: $DEPLOY_URL"
          bash scripts/smoke-basic-auth.sh "$DEPLOY_URL"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
      - name: Attach ${{ env.STAGING_HOST }} (Pages custom domain + DNS CNAME)
        run: src/scripts/cf-pages-domain.sh "$PAGES_PROJECT" "$STAGING_HOST"
      - name: Smoke test ${{ env.STAGING_HOST }} (custom host gate)
        env:
          SMOKE_PATHS: / /aboutus/ /blog/ /contactus/ /donations/ /resources/
        run: bash scripts/smoke-staging-custom-host.sh "https://$STAGING_HOST"
